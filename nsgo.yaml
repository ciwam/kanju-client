name: Kanju
id: me.kanju.client
version: 0.1.0
# 每次发版由 release.sh 自动 +1（检查更新比对本地与线上 build 号）。
build_number: 20261115214454

dev:
  target: native

build:
  output: dist
  targets: [macos_arm64, android_arm64]

# Android 明文流量：应用的图片/媒体全走内嵌后端 127.0.0.1 HTTP 代理，
# 而 nsgo 的 APK manifest 不支持注入 usesCleartextTraffic（框架缺陷，
# docs/nsgo-bugs.md #A1）——target_sdk 降到 27（Android 9 前）绕开
# 系统的明文禁令。框架补上 cleartext 配置后恢复 34。
android:
  target_sdk: 27

# GitHub Releases：install.sh 与自动更新从这里取（也是发布目标仓库）。
release:
  github: ciwam/kanju-client
